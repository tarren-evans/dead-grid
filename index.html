<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030611"><link rel="manifest" href="manifest.webmanifest">
<title>Dead Grid 0.4.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06120f;color:#eaffff;font-family:Consolas,monospace;image-rendering:pixelated}
button,input{font:inherit}button{color:#eaffff;background:#071127;border:1px solid #19ddff;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.app{width:100%;height:100dvh;max-width:1600px;margin:auto;padding:7px;background:#02040b;display:grid;grid-template-rows:44px minmax(0,1fr);gap:6px;overflow:hidden}
.top{min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.topdev{justify-self:center;height:28px;padding:3px 12px;font-size:9px;border-color:#ff3dc8}.topdev.active{background:#ff3dc8;color:#05020a;box-shadow:0 0 12px #ff3dc8}.logo{font-weight:900;letter-spacing:.15em;color:#ff3dc8;white-space:nowrap}.logo span{color:#2eeaff}
.stats{display:flex;justify-content:flex-end;gap:5px;min-width:0}.stat{white-space:nowrap;border:1px solid #117e9d;background:#06101e;padding:6px 8px;font-size:12px}.stat b{color:#ffe65b}
.main{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:6px;overflow:hidden}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;border:2px solid #19dfff;background:#02040b;touch-action:none}
canvas{display:block;width:100%;height:100%}.maptag{position:absolute;left:9px;bottom:8px;color:#2eeaff;background:#02040bdd;border:1px solid #137b98;padding:4px 7px;font-size:9px;pointer-events:none}
.paused{display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:7;background:#ff3dc8;color:#09030b;padding:6px 12px;font-weight:bold}.paused.show{display:block}
.ghost{display:none;position:absolute;z-index:8;pointer-events:none;border:2px solid #ff3dc8;background:#071127ed;padding:7px;font-size:10px}
.modal{display:none;position:absolute;inset:0;z-index:12;background:#01020be9;align-items:center;justify-content:center}.modal.show{display:flex}.box{max-width:460px;border:3px solid #ff3dc8;background:#080d1e;padding:18px;text-align:center}.box h2{color:#2eeaff}.row{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.row button{padding:8px 12px}
.panel{min-height:0;overflow:hidden;border:2px solid #263c68;background:#060a16;padding:7px;display:grid;grid-template-rows:auto auto auto auto auto auto minmax(42px,1fr) auto;gap:6px}
.panel h3{margin:0;color:#2eeaff;font-size:14px}.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.card{position:relative;min-width:0;height:104px;border:2px solid #31446e;background:#081022;padding:3px;overflow:hidden;user-select:none;touch-action:none}.card.unlocked{border-color:#ff3dc8;cursor:grab}.card.inspecting{box-shadow:0 0 0 1px #fff,0 0 12px #2eeaff}.card.locked{opacity:.62}.card.canunlock{opacity:1;border-color:#ffe65b;cursor:pointer}
.portrait{height:62px;position:relative;overflow:hidden;background:linear-gradient(135deg,#10193a,#070b18);border-bottom:1px solid #263c68}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;image-rendering:pixelated}
.cardname{font-size:8px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.cardrole,.cardcost{font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardrole{color:#8bb8c8}.cardcost{color:#ffe65b}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.controls .active{background:#35ff9b;color:#031008;border-color:#35ff9b}.controls button{height:35px;font-size:9px;padding:2px}.speed.active{background:#ff3dc8;color:#07030a}
.detail{border:1px solid #28536b;background:#07101e;padding:6px;min-height:66px;font-size:9px}.detail strong{font-size:11px}.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}.metric{border:1px solid #1c4860;padding:3px;color:#9cd7e4}.metric b{display:block;color:#fff}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:start;align-self:start;max-height:118px;overflow:hidden}.upgrade{height:58px;border:2px solid #37516f;background:#0b1429;padding:5px;font-size:8px;user-select:none;touch-action:none}.upgrade.available{border-color:#ffe65b;cursor:grab}.upgrade.installed{border-color:#35ff9b}.upgrade strong,.upgrade small{display:block}.upgrade small{color:#91b9cb}.upgrade .cost{color:#ffe65b}
.corebox{display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px;border:1px solid #28536b;background:#07101e;padding:5px;font-size:9px}.corebox button{height:39px;font-size:9px}
.feed{min-height:0;overflow:hidden;border:1px solid #1b4357;background:#020711;padding:5px;font-size:8px;color:#9bdbea}.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px}.dev input{min-width:0;background:#030712;color:#fff;border:1px solid #325b77;padding:5px;font-size:8px}.dev button{font-size:8px}.mode{font-size:7px;color:#7ea8b9}
.mobileHUD{display:none}.context{display:none;position:absolute;z-index:20;pointer-events:auto;width:min(230px,calc(100% - 12px))}
.context::before{content:'';position:absolute;inset:-5px;border:1px solid #ff3dc8;pointer-events:none}
.context.show{display:block}
.context .bubble{width:100%!important;border:2px solid #2eeaff;background:#050b19f5;padding:7px;box-shadow:0 0 16px #2eeaff88}
.context .ctxhead{display:flex;align-items:center;justify-content:space-between;gap:5px;border-bottom:1px solid #284d68;padding-bottom:5px}
.context .ctxclose{width:28px;min-height:28px!important;padding:2px!important;margin:0!important;text-align:center!important}
.context .ctxstats{font-size:8px;color:#a9dce8;margin:5px 0}
.context .ctxhint{font-size:7px;color:#ffe65b;margin-top:5px}.context button{display:block;width:100%;min-height:38px;margin-top:5px;padding:7px;font-size:9px;text-align:left;touch-action:manipulation}.context .title{font-size:9px;color:#ff3dc8;font-weight:bold}
@media(max-width:900px){
 .app{padding:4px;grid-template-rows:34px minmax(0,1fr)}.logo{font-size:10px}.topdev{font-size:7px;height:24px;padding:2px 7px}.stats{gap:2px}.stat{font-size:8px;padding:4px}.main{grid-template-columns:minmax(0,1fr) 196px;gap:4px}.panel{padding:4px;gap:4px;grid-template-rows:auto auto auto auto auto auto minmax(28px,1fr) auto}.panel h3{font-size:10px}
 .roster{grid-template-columns:repeat(4,1fr);gap:2px}.card{height:74px;padding:2px}.portrait{height:43px}.cardname{font-size:6px}.cardrole,.cardcost{font-size:5px}.controls{gap:2px}.controls button{height:28px;font-size:6px}.detail{min-height:46px;padding:3px;font-size:6px}.detail strong{font-size:8px}.bars{display:none}
 .tree{display:none}.corebox{font-size:6px;padding:3px}.corebox button{height:30px;font-size:6px}.feed{font-size:6px;padding:3px}.dev{grid-template-columns:1fr auto}.dev #stdBtn{grid-column:1/3}.dev input,.dev button{font-size:6px;padding:3px}.mode{font-size:6px}
}
@media(max-width:650px){
 .app{grid-template-rows:30px minmax(0,1fr)}.logo{font-size:8px}.topdev{font-size:6px;height:22px;padding:2px 5px}.stat{font-size:6px;padding:3px}.stat:nth-child(6){display:none}.main{grid-template-columns:minmax(0,1fr) 154px}.roster{grid-template-columns:repeat(2,1fr)}.card{height:68px}.portrait{height:39px}.controls{grid-template-columns:repeat(5,1fr)}.controls button{height:24px}.detail{min-height:42px}.feed{display:none}.panel{grid-template-rows:auto auto auto auto auto}.corebox{display:none}.dev{display:none}
}
</style></head><body>
<div class="app"><header class="top"><div class="logo">DEAD <span>GRID</span> // 0.4.2</div><button id="devToggle" class="topdev">DEV</button><div class="stats">
<div class="stat">CH <b id="chapter">1</b></div><div class="stat">WAVE <b id="wave">0</b>/8</div><div class="stat">PWR <b id="power">220</b></div><div class="stat">NRG <b id="energy">0</b></div><div class="stat">CORE <b id="core">20/20</b></div><div class="stat">HOSTILES <b id="hostiles">0</b></div></div></header>
<div class="main"><section class="stage" id="stage"><canvas id="game"></canvas><div class="maptag" id="maptag">NEO TOKYO // SECTOR</div><div class="paused" id="paused">PAUSED</div><div class="ghost" id="ghost"></div><div class="context" id="context"></div>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="row"><button id="modalPrimary"></button><button id="modalSecondary"></button></div></div></div></section>
<aside class="panel"><h3>DEFENDER DECK</h3><div class="roster" id="roster"></div>
<div class="controls"><button id="waveBtn">START</button><button id="autoBtn">AUTO</button><button id="pauseBtn">PAUSE</button><button id="speedBtn" class="speed">SPEED ×1</button><button id="resetBtn">RESET</button></div>
<div class="detail" id="detail"></div><div class="tree" id="tree"></div>
<div class="corebox"><div><b>CORE LVL <span id="coreLevel">1</span></b><br>+5 MAX HP</div><button id="coreUpgrade">UPGRADE<br><span id="coreCost">80</span> PWR</button></div>
<div class="feed" id="log"></div><div><div class="mode" id="modeLabel">MODE: STANDARD</div></div>
</aside></div></div><script src="game.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
